# Test team configuration with GitHub Projects access
# This file demonstrates the projects section for both organization-level
# and repository-level projects

team_name: test-team-with-projects
users:
  - alice
  - bob
  - charlie

roles:
  pull:
    - observability-s/obs-s-access
  push:
    - observability-s/obs-s-backend

projects:
  # Organization-level projects (no repository field)
  organization_projects:
    - number: 1
      permission: read
    - number: 5
      permission: write
    - number: 10
      permission: admin
  
  # Repository-level projects (with repository field)
  repository_projects:
    - repository: observability-s/obs-s-access
      number: 2
      permission: read
    - repository: observability-s/obs-s-backend
      number: 3
      permission: write
    - repository: observability-s/obs-s-frontend
      number: 7
      permission: admin

