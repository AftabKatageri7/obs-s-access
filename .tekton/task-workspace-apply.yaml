apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: apply-task
spec:
  params:
    - name: ibmcloud-apikey-secret-key
      description: field in the secret that contains the api key used to login to ibmcloud
      default: apikey
    - name: continuous-delivery-context-secret
      description: Reference name for the secret resource
      default: "secure-properties"
    - name: WORKSPACE_ID
      description: the workspace id
  workspaces:
    - name: artifacts
      mountPath: /artifacts
  steps:
    - name: terraform-apply
      image: icr.io/continuous-delivery/pipeline/pipeline-base-image:2.58
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.continuous-delivery-context-secret)
              key: $(params.ibmcloud-apikey-secret-key)
              optional: true
        - name: WORKSPACE_ID
          value: $(params.WORKSPACE_ID)
      command: ["/bin/bash", "-c"]
      args:
        - |
          #!/bin/bash
          echo "Workspace $WORKSPACE_ID"

          REGION="--no-region"
          # only parse the region if its the *NEW* workspace id format
          if [[ "$WORKSPACE_ID" == *".workspace"* ]]; then
              REGION=" -r $(echo $WORKSPACE_ID | cut -f1 -d.)"
          fi
          echo "REGION: $REGION"

          # force login (required by schematics cli)
          ibmcloud login --apikey $API_KEY -a "https://cloud.ibm.com" $REGION
          
          # Target resource group
          echo "Targeting resource group: sysdig-ibm-dev"
          ibmcloud target -g sysdig-ibm-dev
          
          # Install Schematics plugin if not present
          echo "Checking for Schematics plugin..."
          if ! ibmcloud plugin list | grep -q "schematics"; then
            echo "Installing Schematics plugin..."
            ibmcloud plugin install schematics -f -r "IBM Cloud"
          else
            echo "Schematics plugin already installed"
          fi
          
          # Verify plugin is available
          echo "Installed plugins:"
          ibmcloud plugin list

          # run schematics apply
          echo "ibmcloud schematics apply --id $WORKSPACE_ID --force"
          ACTIVITY=$(ibmcloud schematics apply --id $WORKSPACE_ID --force --output JSON)
          ACTIVITY_ID=$(echo $ACTIVITY | jq -r ".activityid")
          echo "Activity ID   $ACTIVITY_ID"
          # poll until status is no longer INPROGRESS, or if there is an error
          while :
          do
            STATUS=$(ibmcloud schematics workspace action --id $WORKSPACE_ID --act-id $ACTIVITY_ID --json)
            
            RET_VAL=$?
            if [ $RET_VAL -ne 0 ]; then
              echo $STATUS
              exit $RET_VAL
            else
              STATUS_VALUE=$(echo $STATUS | jq -r ".status")
              echo "Polling for status: $STATUS_VALUE"
              if [ "$STATUS_VALUE" = "FAILED" ]; then
                ibmcloud schematics logs --id $WORKSPACE_ID --act-id $ACTIVITY_ID
                exit 1
              elif [ "$STATUS_VALUE" != "INPROGRESS" ]; then
                break
              fi
            fi
            # sleep for 5 seconds, while waiting for completion
            sleep 5
          done
          ibmcloud schematics logs --id $WORKSPACE_ID --act-id $ACTIVITY_ID
