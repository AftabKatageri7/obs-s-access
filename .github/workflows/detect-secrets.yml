name: Detect Secrets
    
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    
jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install IBM detect-secrets
        run: pip install git+https://github.com/IBM/detect-secrets.git
          
      - name: Run detect-secrets scan
        run: |
          detect-secrets -C scan --baseline .secrets.baseline --exclude-files 'package-lock.json'
              
      - name: Verify baseline is up to date
        run: |
          detect-secrets -C audit --report .secrets.baseline
