name: Detect Secrets
    
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    
jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install IBM detect-secrets
        run: pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"
          
      - name: Run detect-secrets scan
        run: |
          detect-secrets scan --update .secrets.baseline --all-files --exclude-files 'package-lock.json' --use-all-plugins
              
      - name: Verify baseline is up to date
        run: |
          detect-secrets audit --report .secrets.baseline
