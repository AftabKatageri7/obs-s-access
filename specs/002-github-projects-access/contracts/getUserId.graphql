# Get User ID
# Retrieves the GraphQL node ID for a GitHub user by their login
# Required before adding/updating project collaborators

query GetUserId($login: String!) {
  user(login: $login) {
    id
    login
    name
  }
}

# Example Variables:
# {
#   "login": "alice-dev"
# }

