# List Organization Projects
# Retrieves all Projects v2 for a given organization
# Used to validate project numbers and fetch project IDs

query ListOrganizationProjects($org: String!, $cursor: String) {
  organization(login: $org) {
    projectsV2(first: 100, after: $cursor) {
      nodes {
        id
        number
        title
        closed
        url
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

