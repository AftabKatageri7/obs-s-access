# Update Project Collaborator
# Adds a new collaborator or updates existing collaborator's permission on a project
# This mutation handles both add and update operations

mutation UpdateProjectCollaborator($projectId: ID!, $userId: ID!, $role: ProjectV2Roles!) {
  updateProjectV2Collaborators(
    input: {
      projectId: $projectId
      collaborators: [{userId: $userId, role: $role}]
    }
  ) {
    collaborators {
      totalCount
    }
  }
}

# Valid ProjectV2Roles values (GitHub API enum):
# - READER: View-only access (maps from 'read')
# - WRITER: Can edit project items and views (maps from 'write')
# - ADMIN: Full control including project settings (maps from 'admin')
# - NONE: Removes access (maps from 'none', or use removeProjectV2Collaborator mutation)

# Example Variables (Add/Update):
# {
#   "projectId": "PVT_kwDOABCDEF4AABCD",
#   "userId": "U_kgDOABCDEF",
#   "role": "WRITE"
# }

# Example Response:
# {
#   "data": {
#     "updateProjectV2Collaborators": {
#       "collaborators": {
#         "totalCount": 1
#       }
#     }
#   }
# }
#
# Note: The collaborators field returns ProjectV2ActorConnection type,
# which doesn't expose individual userId/role fields in the response.
# The mutation succeeds if no errors are returned.

# Note: To get userId, first query the user:
# query GetUserId($login: String!) {
