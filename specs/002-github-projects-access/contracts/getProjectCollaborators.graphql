# Get Project Collaborators
# Retrieves all collaborators for a specific project
# Used to check current permissions and detect stale collaborators

query GetProjectCollaborators($projectId: ID!, $cursor: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      id
      number
      title
      collaborators(first: 100, after: $cursor) {
        nodes {
          login
          role
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        totalCount
      }
    }
  }
}

