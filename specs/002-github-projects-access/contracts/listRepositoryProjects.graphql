# List Repository Projects
# Retrieves all Projects v2 for a given repository
# Used to validate project numbers and fetch project IDs for repository-level projects

query ListRepositoryProjects($owner: String!, $repo: String!, $cursor: String) {
  repository(owner: $owner, name: $repo) {
    projectsV2(first: 100, after: $cursor) {
      nodes {
        id
        number
        title
        closed
        url
      }
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
    }
  }
}

