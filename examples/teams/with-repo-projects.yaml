# Example: Team with Repository-Level Projects Access
# Repository projects are scoped to a specific repository

team_name: "Frontend Team"
members:
  - username: "david"
  - username: "emma"
  - username: "frank"

repositories:
  - name: "observability-s/web-ui"
    permission: "write"
  - name: "observability-s/mobile-app"
    permission: "write"

# Repository-level projects (with repository field)
projects:
  - number: 3
    repository: "observability-s/web-ui"
    permission: "admin"  # Full control of "UI Sprint Board" project
  - number: 7
    repository: "observability-s/web-ui"
    permission: "write"  # Can edit "Feature Requests" project
  - number: 2
    repository: "observability-s/mobile-app"
    permission: "write"  # Can edit "Mobile Backlog" project

