# DevOps Team Configuration
# This team has broad access to infrastructure and deployment repositories

team_name: DevOps Team

users:
  - george-devops
  - hannah-devops
  - ivan-devops

roles:
  # Triage access to all repositories for issue management
  triage:
    - obs-s-api-gateway
    - obs-s-dashboard
    - obs-s-web-ui
    - obs-s-metrics-collector
  
  # Maintain access to infrastructure repositories
  maintain:
    - obs-s-backend-infra
    - obs-s-frontend-infra
    - obs-s-database-migrations
    - obs-s-cdn-config
  
  # Admin access to deployment and CI/CD
  admin:
    - obs-s-deployment-scripts
    - obs-s-ci-cd-config
    - obs-s-monitoring-config
    - obs-s-terraform-modules

