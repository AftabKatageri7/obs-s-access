# Example: Team with Mixed Projects Access
# Demonstrates both organization-level and repository-level projects

team_name: "DevOps Team"
members:
  - username: "grace"
  - username: "henry"
  - username: "iris"

repositories:
  - name: "observability-s/infrastructure"
    permission: "admin"
  - name: "observability-s/ci-cd-pipeline"
    permission: "admin"
  - name: "observability-s/monitoring"
    permission: "write"

# Mixed projects: both organization-level and repository-level
projects:
  # Organization-level projects (no repository field)
  - number: 1
    permission: "admin"  # "Infrastructure Roadmap" - org-wide planning
  - number: 8
    permission: "write"  # "DevOps Initiatives" - org-wide tracking
  
  # Repository-level projects (with repository field)
  - number: 4
    repository: "observability-s/infrastructure"
    permission: "admin"  # "Terraform Modules" - repo-specific
  - number: 6
    repository: "observability-s/ci-cd-pipeline"
    permission: "admin"  # "Pipeline Improvements" - repo-specific
  - number: 9
    repository: "observability-s/monitoring"
    permission: "read"   # "Metrics Dashboard" - read-only access

