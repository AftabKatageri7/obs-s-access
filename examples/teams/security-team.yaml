# Security Team Configuration
# Demonstrates overlapping users across multiple roles and repositories
# This example shows how the same user can have different permissions
# across different repositories based on their role assignments

team_name: Security Team

users:
  - alice-security
  - bob-infosec
  - charlie-devsec
  - diana-appsec
  - eve-analyst
  - frank-soc
  - grace-compliance
  - henry-auditor

roles:
  # Admin access to security-critical repositories
  admin:
    - security-scanner
    - vulnerability-tracker
    - incident-response
    - compliance-tools
  
  # Write access to implementation repositories
  push:
    - security-scanner
    - vulnerability-tracker
    - security-automation
    - policy-docs
  
  # Read access for monitoring and analysis
  pull:
    - security-scanner
    - vulnerability-tracker
    - incident-response
    - audit-logs
    - compliance-tools
    - policy-docs

# Note on Overlapping Permissions:
#
# When the same user appears in multiple roles for the same repository,
# the conflict resolution follows alphabetical file processing order.
# Within a single file, all roles are applied, and GitHub will use the
# highest permission level granted.
#
# For example, if alice-security is in both the admin and push roles
# for security-scanner, GitHub will grant admin access (highest permission).
#
# Expected Effective Permissions (GitHub takes highest):
#
# alice-security:
#   - security-scanner: admin (highest of admin/push/pull)
#   - vulnerability-tracker: admin (highest of admin/push/pull)
#   - incident-response: admin (highest of admin/pull)
#   - compliance-tools: admin (highest of admin/pull)
#   - security-automation: push (only push granted)
#   - audit-logs: pull (only pull granted)
#   - policy-docs: push (highest of push/pull)
#
# bob-infosec:
#   - security-scanner: admin (highest of admin/push/pull)
#   - vulnerability-tracker: admin (highest of admin/push/pull)
#   - incident-response: admin (highest of admin/pull)
#   - compliance-tools: admin (highest of admin/pull)
#   - security-automation: push (only push granted)
#   - audit-logs: pull (only pull granted)
#   - policy-docs: push (highest of push/pull)
#
# charlie-devsec:
#   - security-scanner: push (highest of push/pull)
#   - vulnerability-tracker: push (highest of push/pull)
#   - security-automation: push (only push granted)
#   - incident-response: pull (only pull granted)
#   - audit-logs: pull (only pull granted)
#   - compliance-tools: pull (only pull granted)
#   - policy-docs: push (highest of push/pull)
#
# Best Practices:
#
# 1. Role Separation:
#    - Clearly define who needs admin vs write vs read access
#    - Use principle of least privilege
#    - Document why users need elevated permissions
#
# 2. Regular Reviews:
#    - Audit security team access quarterly
#    - Remove users who change roles or leave
#    - Verify admin access is still required
#
# 3. Compliance:
#    - Maintain audit logs of all access changes
#    - Document security incidents and access reviews
#    - Follow organizational security policies

