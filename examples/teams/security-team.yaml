# Security Team Configuration
# Demonstrates overlapping users across multiple roles and repositories
# This example shows how the same user can have different permissions
# across different repositories based on their role assignments

# Security Leads - Full admin access to all security-related repositories
security-leads:
  members:
    - alice-security
    - bob-infosec
  repositories:
    - repo: observability-s/security-scanner
      permission: admin
    - repo: observability-s/vulnerability-tracker
      permission: admin
    - repo: observability-s/incident-response
      permission: admin
    - repo: observability-s/compliance-tools
      permission: admin

# Security Engineers - Write access to implementation repositories
security-engineers:
  members:
    - alice-security      # Also in security-leads (higher permission wins)
    - charlie-devsec
    - diana-appsec
  repositories:
    - repo: observability-s/security-scanner
      permission: push
    - repo: observability-s/vulnerability-tracker
      permission: push
    - repo: observability-s/security-automation
      permission: push

# Security Analysts - Read access for monitoring and analysis
security-analysts:
  members:
    - bob-infosec         # Also in security-leads (higher permission wins)
    - eve-analyst
    - frank-soc
  repositories:
    - repo: observability-s/security-scanner
      permission: pull
    - repo: observability-s/vulnerability-tracker
      permission: pull
    - repo: observability-s/incident-response
      permission: pull
    - repo: observability-s/audit-logs
      permission: pull

# Compliance Team - Read access to compliance and audit repositories
compliance-team:
  members:
    - grace-compliance
    - henry-auditor
    - alice-security      # Also in security-leads and security-engineers
  repositories:
    - repo: observability-s/compliance-tools
      permission: pull
    - repo: observability-s/audit-logs
      permission: pull
    - repo: observability-s/policy-docs
      permission: push

# Expected Effective Permissions (after conflict resolution):
# 
# alice-security:
#   - security-scanner: admin (from security-leads, highest)
#   - vulnerability-tracker: admin (from security-leads, highest)
#   - incident-response: admin (from security-leads)
#   - compliance-tools: admin (from security-leads, highest)
#   - security-automation: push (from security-engineers, only role)
#   - audit-logs: pull (from compliance-team, only role)
#   - policy-docs: push (from compliance-team, only role)
#
# bob-infosec:
#   - security-scanner: admin (from security-leads, highest)
#   - vulnerability-tracker: admin (from security-leads, highest)
#   - incident-response: admin (from security-leads, highest)
#   - compliance-tools: admin (from security-leads)
#   - audit-logs: pull (from security-analysts, only role)
#
# charlie-devsec:
#   - security-scanner: push (from security-engineers, only role)
#   - vulnerability-tracker: push (from security-engineers, only role)
#   - security-automation: push (from security-engineers, only role)
#
# Note: This demonstrates the conflict resolution strategy where
# higher permissions (admin > push > pull) take precedence when
# a user appears in multiple roles for the same repository.

