# Backend Team Configuration
# This team has access to backend services and infrastructure repositories

team_name: Backend Team

users:
  - alice-backend
  - bob-backend
  - charlie-backend

roles:
  # Read-only access to documentation and shared resources
  read:
    - obs-s-docs
    - obs-s-shared-configs
  
  # Write access to backend services
  write:
    - obs-s-api-gateway
    - obs-s-metrics-collector
    - obs-s-log-aggregator
    - obs-s-alert-manager
  
  # Admin access to core backend infrastructure
  admin:
    - obs-s-backend-infra
    - obs-s-database-migrations

