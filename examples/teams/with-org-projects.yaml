# Example: Team with Organization-Level Projects Access
# Organization projects are accessible across all repositories in the org

team_name: "Platform Team"
members:
  - username: "alice"
  - username: "bob"
  - username: "charlie"

repositories:
  - name: "observability-s/infrastructure"
    permission: "admin"
  - name: "observability-s/monitoring"
    permission: "write"

# Organization-level projects (no repository field)
projects:
  - number: 1
    permission: "admin"  # Full control of "Infrastructure Roadmap" project
  - number: 5
    permission: "write"  # Can edit "Platform Initiatives" project
  - number: 12
    permission: "read"   # Read-only access to "Security Audit" project

